# Smithery configuration — https://smithery.ai/docs
# NOTE: the scan API allowlists `source` to {web,api,mcp,agent} and rewrites anything
# else to `api`. So we do NOT set a custom COLLIMER_SCAN_SOURCE here (it would
# misattribute Smithery scans to `api`); the default `mcp` is correct. Per-directory
# attribution needs the product's free-form `src` field (collimer#417), not this enum.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      email:
        type: string
        description: "Optional — email to receive the full report."
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "collimer-mcp"]
    })
